<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The home page is light, every other page is dark. Marking it here, before anything is painted,
      // keeps a first-time visitor (who waits for their saved settings) from seeing a dark flash first.
      // Every public page (all but the admin) is light, like the home page, so none of them starts with a dark flash.
      if (location.pathname !== '/' && location.pathname.indexOf('/admin') !== 0) document.documentElement.setAttribute('data-light', '');
      if (location.pathname === '/') {
        document.documentElement.setAttribute('data-home', '');
        // Start downloading the portrait (the largest thing on the first screen) straight away, not once the page's scripts have run.
        if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = '/walid-hero-animated-v2.webp'; l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      }
    </script>

    <script>
      // Google Tag Manager starts once the page has loaded and the browser is idle, so it never competes with the first paint.
      // The container id comes from the VITE_GTM_ID build setting (Vercel); without one, nothing loads.
      (function (w, d, s, l, i) {
        if (!/^GTM-[A-Z0-9]+$/.test(i)) return;
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        function load() {
          var f = d.getElementsByTagName(s)[0], j = d.createElement(s);
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i;
          f.parentNode.insertBefore(j, f);
        }
        function later() { (w.requestIdleCallback || function (cb) { setTimeout(cb, 1); })(load, { timeout: 4000 }); }
        if (d.readyState === 'complete') later(); else w.addEventListener('load', later);
      })(window, document, 'script', 'dataLayer', '%VITE_GTM_ID%');
    </script>

    <title>Loading…</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>html,body{background:#0a0a0a;color:#fff}html[data-light],html[data-light] body{background:#fff;color:#0d1117}</style>
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('brand_colors') || 'null');
          if (c && c.p) document.documentElement.style.setProperty('--color-accent', c.p);
          if (c && c.s) document.documentElement.style.setProperty('--color-accent-secondary', c.s);
          if (c && c.g) { document.documentElement.style.setProperty('--accent-gradient', c.g); document.documentElement.setAttribute('data-accent', 'gradient'); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%" height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe>
      <main></main>
    </noscript>
    <div id="root"><main id="static-content" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
